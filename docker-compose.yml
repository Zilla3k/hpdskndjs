services:
  postgres:
    image: postgres:16-alpine
    container_name: helpdesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-helpdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-helpdesk123}
      POSTGRES_DB: ${POSTGRES_DB:-helpdesk_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - helpdesk_postgres_data:/var/lib/postgresql/data

volumes:
  helpdesk_postgres_data:
